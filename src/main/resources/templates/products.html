<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org"><head><title>Products</title></head><body><h1>Products</h1><table border="1"><tr><th>Name</th><th>Description</th><th>Price</th><th>Stock</th><th>Category</th><th>Action</th></tr><tr th:each="product : ${products}"><td th:text="${product.productName}"></td><td th:text="${product.description}"></td><td th:text="${product.price}"></td><td th:text="${product.stock}"></td><td th:text="${product.category}"></td><td><form action="/cart/add" method="post"><input type="hidden" name="productId" th:value="${product.productId}"><input type="number" name="quantity" value="1" min="1"><button type="submit">Add to Cart</button></form></td></tr></table><a href="/cart">Cart</a> | <a href="/customer-dashboard">Dashboard</a></body></html>
