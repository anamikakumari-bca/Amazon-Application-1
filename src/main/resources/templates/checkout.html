<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org"><head><title>Checkout</title></head><body><h1>Checkout</h1><p th:text="${message}"></p><ul><li th:each="product : ${products}" th:text="${product.productName + ' x ' + product.cartQuantity + ' = ₹' + product.cartTotal}"></li></ul><h2>Total: ₹<span th:text="${total}"></span></h2><form action="/checkout" method="post"><label>Payment Method:</label><select name="paymentMethod"><option value="CARD">Card</option><option value="UPI">UPI</option><option value="COD">Cash on Delivery</option></select><button type="submit">Place Order</button></form><a href="/cart">Back to Cart</a></body></html>
